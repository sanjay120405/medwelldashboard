<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Login – Medwell Dashboard</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body {
      font-family:'Segoe UI',system-ui,sans-serif;
      background:linear-gradient(135deg,#1E3A8A 0%,#2563EB 60%,#60A5FA 100%);
      min-height:100vh;
      display:flex;align-items:center;justify-content:center;
    }
    .card {
      background:#fff;
      border-radius:20px;
      padding:44px 40px 36px;
      width:380px;
      max-width:95vw;
      box-shadow:0 24px 80px rgba(0,0,0,0.25);
    }
    .logo {
      text-align:center;
      margin-bottom:28px;
    }
    .logo-icon {
      width:60px;height:60px;border-radius:16px;
      background:linear-gradient(135deg,#2563EB,#60A5FA);
      display:inline-flex;align-items:center;justify-content:center;
      font-size:28px;margin-bottom:12px;
    }
    .logo-title { font-size:20px;font-weight:800;color:#111827; }
    .logo-sub   { font-size:12px;color:#6B7280;margin-top:3px;letter-spacing:.5px;text-transform:uppercase; }

    label { display:block;font-size:13px;font-weight:600;color:#111827;margin-bottom:6px; }
    .field { margin-bottom:18px; }
    input[type=text],input[type=password] {
      width:100%;padding:11px 14px;
      border:1.5px solid #E5E7EB;border-radius:10px;
      font-size:14px;color:#111827;outline:none;
      font-family:inherit;transition:border-color .15s;
    }
    input[type=text]:focus,input[type=password]:focus { border-color:#2563EB; }

    .btn-login {
      width:100%;padding:13px;
      background:#2563EB;color:#fff;
      border:none;border-radius:10px;
      font-size:15px;font-weight:700;cursor:pointer;
      transition:background .15s;margin-top:4px;
    }
    .btn-login:hover { background:#1D4ED8; }

    .error {
      background:#FEF2F2;border:1px solid #FECACA;
      color:#DC2626;font-size:13px;font-weight:600;
      padding:10px 14px;border-radius:8px;
      margin-bottom:16px;display:none;
      text-align:center;
    }
    .error.show { display:block; }

    .footer { text-align:center;margin-top:22px;font-size:11px;color:#9CA3AF; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-icon">🏥</div>
      <div class="logo-title">Business Dashboard</div>
      <div class="logo-sub">Business Management Portal</div>
    </div>

    <div class="error" id="errMsg">Incorrect username or password.</div>

    <form onsubmit="doLogin(event)">
      <div class="field">
        <label>Username</label>
        <input type="text" id="uname" placeholder="Enter username" autocomplete="username"/>
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="pwd" placeholder="Enter password" autocomplete="current-password"/>
      </div>
      <button type="submit" class="btn-login">Sign In</button>
    </form>

    <div class="footer">Medwell Group · Internal Use Only</div>
  </div>

  <script>
    // Redirect if already logged in
    if (sessionStorage.getItem('mw_auth')) location.replace('index.html');

    function doLogin(e) {
      e.preventDefault();
      const u = document.getElementById('uname').value.trim();
      const p = document.getElementById('pwd').value.trim();
      const err = document.getElementById('errMsg');

      if (u === 'medwelldashboard' && (p === '9940354445' || p === '9171419911')) {
        sessionStorage.setItem('mw_auth', '1');
        location.replace('index.html');
      } else {
        err.classList.add('show');
        document.getElementById('pwd').value = '';
      }
    }
  </script>
</body>
</html>
