<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Suppliers Master – Medwell Wholesale</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Segoe UI',system-ui,sans-serif;background:#F1F5F9;min-height:100vh;color:#111827}

    .topbar{background:#fff;border-bottom:1px solid #E0ECFF;height:60px;display:flex;align-items:center;padding:0 28px;gap:14px;position:sticky;top:0;z-index:50;box-shadow:0 1px 6px rgba(37,99,235,0.06)}
    .back-btn{display:flex;align-items:center;gap:7px;background:none;border:1.5px solid #E5E7EB;border-radius:9px;padding:7px 14px;font-size:13px;font-weight:600;color:#111827;text-decoration:none;transition:background .15s}
    .back-btn:hover{background:#F9FAFB}
    .divider{width:1px;height:26px;background:#E5E7EB}
    .topbar-icon{width:36px;height:36px;border-radius:10px;background:#EFF6FF;display:flex;align-items:center;justify-content:center;font-size:18px}
    .topbar-info{flex:1}
    .topbar-name{font-size:16px;font-weight:700;color:#111827}
    .topbar-sub{font-size:11px;color:#111827;text-transform:uppercase;letter-spacing:.7px}
    .topbar-badge{background:#EFF6FF;color:#2563EB;font-size:11px;font-weight:600;padding:4px 12px;border-radius:20px;border:1px solid #BFDBFE}

    .breadcrumb{background:#fff;border-bottom:1px solid #E5E7EB;padding:10px 28px;display:flex;align-items:center;gap:8px;font-size:12px;color:#111827}
    .breadcrumb a{color:#2563EB;text-decoration:none}
    .breadcrumb a:hover{text-decoration:underline}
    .breadcrumb .sep{color:#D1D5DB}
    .breadcrumb .current{color:#111827;font-weight:600}

    .body{padding:28px}

    .toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px}
    .toolbar-left{display:flex;align-items:center;gap:10px}
    .page-title{font-size:20px;font-weight:800;color:#111827;letter-spacing:-.4px}
    .record-count{font-size:12px;color:#111827;background:#F3F4F6;padding:4px 12px;border-radius:20px}
    .toolbar-right{display:flex;align-items:center;gap:10px}
    .search-box{display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid #E5E7EB;border-radius:9px;padding:8px 14px}
    .search-box input{border:none;outline:none;font-size:13px;color:#111827;width:220px}

    .btn{display:flex;align-items:center;gap:6px;padding:8px 16px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;border:none}
    .btn-primary{background:#2563EB;color:white}
    .btn-primary:hover{background:#1D4ED8}

    .table-wrap{background:#fff;border-radius:14px;box-shadow:0 1px 6px rgba(0,0,0,0.06);overflow:hidden}
    .table-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid #F3F4F6}
    .table-header-title{font-size:14px;font-weight:700;color:#111827}
    .table-header-sub{font-size:11px;color:#111827;margin-top:2px}
    .table-scroll{overflow-x:auto}

    table{width:100%;border-collapse:collapse;font-size:13px;min-width:700px}
    thead th{background:#F8FAFC;padding:12px 16px;text-align:left;font-size:11px;font-weight:700;color:#111827;text-transform:uppercase;letter-spacing:.7px;border-bottom:1px solid #E5E7EB;white-space:nowrap}
    tbody tr{border-bottom:1px solid #F3F4F6;transition:background .12s}
    tbody tr:last-child{border-bottom:none}
    tbody tr:hover{background:#F8FAFC}
    tbody td{padding:13px 16px;color:#111827;vertical-align:middle}

    .empty-row td{text-align:center;padding:40px;color:#111827;font-size:13px}

    .pagination{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-top:1px solid #F3F4F6;font-size:12px;color:#111827}
    .page-btns{display:flex;gap:6px}
    .page-btn{padding:5px 11px;border-radius:7px;border:1.5px solid #E5E7EB;background:#fff;font-size:12px;font-weight:600;cursor:pointer;color:#111827}
    .page-btn.active{background:#2563EB;color:#fff;border-color:#2563EB}

    .btn-edit{padding:4px 10px;font-size:11px;font-weight:600;border-radius:6px;border:1.5px solid #DBEAFE;background:#EFF6FF;color:#2563EB;cursor:pointer}
    .btn-edit:hover{background:#DBEAFE}
    .btn-del{padding:4px 10px;font-size:11px;font-weight:600;border-radius:6px;border:1.5px solid #FEE2E2;background:#FFF5F5;color:#DC2626;cursor:pointer}
    .btn-del:hover{background:#FEE2E2}
    .action-cell{display:flex;gap:6px;align-items:center}

    /* Modal */
    .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:9999;align-items:center;justify-content:center}
    .modal-overlay.show{display:flex}
    .modal-box{background:#fff;border-radius:18px;padding:28px 28px 24px;width:480px;max-width:95vw;box-shadow:0 20px 60px rgba(0,0,0,0.2);max-height:90vh;overflow-y:auto}
    .modal-title{font-size:16px;font-weight:700;color:#111827;margin-bottom:20px}
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .form-full{grid-column:1/-1}
    .form-label{font-size:12px;color:#111827;font-weight:600;display:block;margin-bottom:5px}
    .form-input{width:100%;padding:9px 12px;border:1.5px solid #E5E7EB;border-radius:8px;font-size:13px;outline:none;font-family:inherit;color:#111827}
    .form-input:focus{border-color:#2563EB}
    .modal-footer{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
    .btn-cancel{padding:9px 20px;border:1.5px solid #E5E7EB;border-radius:8px;background:#fff;font-size:13px;font-weight:600;cursor:pointer;color:#111827}
    .btn-save{padding:9px 24px;background:#2563EB;color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer}
    .btn-save:hover{background:#1D4ED8}
  </style>
</head>
<body>
  <script>if(!sessionStorage.getItem('mw_auth')){location.replace('login.html')}</script>

  <div class="topbar">
    <a class="back-btn" href="index.html">← Back</a>
    <div class="divider"></div>
    <div class="topbar-icon">🏢</div>
    <div class="topbar-info">
      <div class="topbar-name">Suppliers Master</div>
      <div class="topbar-sub">Medwell Wholesale</div>
    </div>
    <span class="topbar-badge">MASTER</span>
  </div>

  <div class="breadcrumb">
    <a href="index.html">Dashboard</a>
    <span class="sep">›</span>
    <span class="current">Suppliers Master</span>
  </div>

  <div class="body">
    <div class="toolbar">
      <div class="toolbar-left">
        <div class="page-title">Suppliers</div>
        <div class="record-count" id="record-count">0 records</div>
      </div>
      <div class="toolbar-right">
        <div class="search-box">
          <svg width="14" height="14" fill="none" stroke="#9CA3AF" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
          <input type="text" id="searchInput" placeholder="Search supplier, phone, GSTIN…" oninput="filterTable()"/>
        </div>
        <button class="btn btn-primary" onclick="addRow()">+ Add Supplier</button>
      </div>
    </div>

    <div class="table-wrap">
      <div class="table-header">
        <div>
          <div class="table-header-title">Supplier List</div>
          <div class="table-header-sub">Medwell Wholesale — Master Data</div>
        </div>
      </div>
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Supplier Name</th>
              <th>Phone</th>
              <th>Address</th>
              <th>GSTIN</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="supplierBody">
            <tr class="empty-row"><td colspan="6">Loading…</td></tr>
          </tbody>
        </table>
      </div>
      <div class="pagination">
        <span id="paginationInfo">Showing 0–0 of 0</span>
        <div class="page-btns" id="pageBtns"></div>
      </div>
    </div>
  </div>

  <!-- Add/Edit Modal -->
  <div class="modal-overlay" id="modal">
    <div class="modal-box">
      <div class="modal-title" id="modalTitle">Add Supplier</div>
      <div class="form-grid">
        <div class="form-full">
          <label class="form-label">Supplier Name *</label>
          <input id="f_name" class="form-input" type="text" placeholder="Enter supplier name"/>
        </div>
        <div>
          <label class="form-label">Phone</label>
          <input id="f_phone" class="form-input" type="text" placeholder="Phone number"/>
        </div>
        <div>
          <label class="form-label">GSTIN</label>
          <input id="f_gstin" class="form-input" type="text" placeholder="GST number"/>
        </div>
        <div class="form-full">
          <label class="form-label">Address</label>
          <textarea id="f_address" class="form-input" rows="3" placeholder="Full address" style="resize:vertical;"></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-cancel" onclick="closeModal()">Cancel</button>
        <button class="btn-save" onclick="saveRow()">Save Supplier</button>
      </div>
    </div>
  </div>

  <!-- Confirm Delete Modal -->
  <div id="confirmModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:99999;align-items:center;justify-content:center;">
    <div style="background:#fff;border-radius:16px;padding:28px 32px;width:340px;max-width:92vw;box-shadow:0 20px 60px rgba(0,0,0,0.25);text-align:center;">
      <div style="width:52px;height:52px;background:#FEE2E2;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:24px;">🗑</div>
      <div style="font-size:17px;font-weight:700;color:#111827;margin-bottom:8px;">Delete Supplier?</div>
      <div id="confirmMsg" style="font-size:13px;color:#111827;margin-bottom:24px;line-height:1.5;">This action cannot be undone.</div>
      <div style="display:flex;gap:10px;justify-content:center;">
        <button id="confirmCancelBtn" style="padding:10px 24px;border:1.5px solid #E5E7EB;border-radius:8px;background:#fff;font-size:13px;font-weight:600;cursor:pointer;color:#111827;">Cancel</button>
        <button id="confirmOkBtn" style="padding:10px 24px;background:#DC2626;color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;">Delete</button>
      </div>
    </div>
  </div>

  <script>
    const SUPA_URL = 'https://ascolgmqofzoaqukkhvk.supabase.co';
    const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFzY29sZ21xb2Z6b2FxdWtraHZrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI1NTU5ODgsImV4cCI6MjA5ODEzMTk4OH0.d-WVh4Al9siYBxnnEtuEtn2__uekflwGWFJLB560lPc';
    const db = supabase.createClient(SUPA_URL, SUPA_KEY);

    let data = [], filtered = [], currentPage = 1, editingId = null;
    const PAGE_SIZE = 50;

    function esc(s){if(s==null||s==='')return'—';const v=String(s).trim();if(!v)return'—';return v.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}

    async function loadData() {
      document.getElementById('supplierBody').innerHTML = '<tr class="empty-row"><td colspan="6">Loading…</td></tr>';
      const FETCH_SIZE = 1000;
      let allRows = [], from = 0;
      while (true) {
        const { data: rows, error } = await db
          .from('suppliers')
          .select('*')
          .order('name', { ascending: true })
          .range(from, from + FETCH_SIZE - 1);
        if (error) {
          document.getElementById('supplierBody').innerHTML = `<tr class="empty-row"><td colspan="6" style="color:#EF4444">Error: ${error.message}</td></tr>`;
          return;
        }
        if (!rows || rows.length === 0) break;
        allRows = allRows.concat(rows);
        if (rows.length < FETCH_SIZE) break;
        from += FETCH_SIZE;
      }
      data = allRows;
      filtered = [...data];
      currentPage = 1;
      renderTable();
    }

    function renderTable() {
      const start = (currentPage - 1) * PAGE_SIZE;
      const end   = Math.min(start + PAGE_SIZE, filtered.length);
      const slice = filtered.slice(start, end);
      const tbody = document.getElementById('supplierBody');

      if (slice.length === 0) {
        tbody.innerHTML = '<tr class="empty-row"><td colspan="6">No suppliers found</td></tr>';
      } else {
        tbody.innerHTML = slice.map((r, i) => `
          <tr>
            <td style="font-size:12px;color:#6B7280">${start + i + 1}</td>
            <td style="font-weight:600">${esc(r.name)}</td>
            <td style="font-size:12px">${esc(r.phone)}</td>
            <td style="font-size:12px;max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(r.address)}</td>
            <td style="font-family:monospace;font-size:12px;color:#2563EB">${esc(r.gstin)}</td>
            <td><div class="action-cell">
              <button class="btn-edit" onclick="editRow('${r.id}')">Edit</button>
              <button class="btn-del" onclick="deleteRow('${r.id}')">Delete</button>
            </div></td>
          </tr>`).join('');
      }

      document.getElementById('paginationInfo').textContent =
        `Showing ${filtered.length ? start+1 : 0}–${end} of ${filtered.length}`;
      document.getElementById('record-count').textContent = filtered.length + ' records';
      renderPagination();
    }

    function renderPagination() {
      const total = Math.ceil(filtered.length / PAGE_SIZE);
      const btns  = document.getElementById('pageBtns');
      btns.innerHTML = '';
      for (let p = 1; p <= total; p++) {
        const b = document.createElement('button');
        b.className = 'page-btn' + (p === currentPage ? ' active' : '');
        b.textContent = p;
        b.onclick = () => { currentPage = p; renderTable(); };
        btns.appendChild(b);
      }
    }

    function filterTable() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      filtered = data.filter(r => {
        if (!q) return true;
        return (r.name||'').toLowerCase().includes(q) ||
               (r.phone||'').toLowerCase().includes(q) ||
               (r.address||'').toLowerCase().includes(q) ||
               (r.gstin||'').toLowerCase().includes(q);
      });
      currentPage = 1;
      renderTable();
    }

    function addRow() {
      editingId = null;
      document.getElementById('modalTitle').textContent = 'Add Supplier';
      ['f_name','f_phone','f_gstin','f_address'].forEach(id => document.getElementById(id).value = '');
      document.getElementById('modal').classList.add('show');
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('show');
      editingId = null;
    }

    function editRow(id) {
      const r = data.find(x => x.id === id);
      if (!r) return;
      editingId = id;
      document.getElementById('modalTitle').textContent = 'Edit Supplier';
      document.getElementById('f_name').value    = r.name    || '';
      document.getElementById('f_phone').value   = r.phone   || '';
      document.getElementById('f_gstin').value   = r.gstin   || '';
      document.getElementById('f_address').value = r.address || '';
      document.getElementById('modal').classList.add('show');
    }

    async function saveRow() {
      const name = document.getElementById('f_name').value.trim();
      if (!name) { alert('Supplier name is required.'); return; }
      const btn = document.querySelector('.btn-save');
      btn.textContent = 'Saving…'; btn.disabled = true;

      const row = {
        name:    name,
        phone:   document.getElementById('f_phone').value.trim() || null,
        gstin:   document.getElementById('f_gstin').value.trim() || null,
        address: document.getElementById('f_address').value.trim() || null,
      };

      if (editingId) {
        const { error } = await db.from('suppliers').update(row).eq('id', editingId);
        btn.textContent = 'Save Supplier'; btn.disabled = false;
        if (error) { alert('Update failed: ' + error.message); return; }
        const idx = data.findIndex(x => x.id === editingId);
        if (idx !== -1) data[idx] = { ...data[idx], ...row };
        filtered = [...data];
      } else {
        const { data: inserted, error } = await db.from('suppliers').insert([row]).select();
        btn.textContent = 'Save Supplier'; btn.disabled = false;
        if (error) { alert('Save failed: ' + error.message); return; }
        data.push(inserted[0]);
        data.sort((a,b) => (a.name||'').localeCompare(b.name||''));
        filtered = [...data];
        currentPage = 1;
      }
      closeModal();
      renderTable();
    }

    async function deleteRow(id) {
      const r = data.find(x => x.id === id);
      if (!await confirmAction(`Delete "${r ? r.name : 'this supplier'}"? This cannot be undone.`)) return;
      const { error } = await db.from('suppliers').delete().eq('id', id);
      if (error) { alert('Delete failed: ' + error.message); return; }
      data     = data.filter(x => x.id !== id);
      filtered = filtered.filter(x => x.id !== id);
      if ((currentPage - 1) * PAGE_SIZE >= filtered.length && currentPage > 1) currentPage--;
      renderTable();
    }

    function confirmAction(msg) {
      document.getElementById('confirmMsg').textContent = msg;
      document.getElementById('confirmModal').style.display = 'flex';
      return new Promise(resolve => {
        document.getElementById('confirmOkBtn').onclick   = () => { document.getElementById('confirmModal').style.display='none'; resolve(true); };
        document.getElementById('confirmCancelBtn').onclick = () => { document.getElementById('confirmModal').style.display='none'; resolve(false); };
      });
    }

    loadData();
  </script>
</body>
</html>
